<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="form-box" id="login-box">
            <h2>Log In</h2>
            <form>
                <input type="text" placeholder="user" required>
                <input type="password" placeholder="pasword" required>
                <button type="submit">log in</button>
                <p>Don't have an account? <a href="#" onclick="toggleForms()">register here</a></p>
            </form>
        </div>

        <div class="form-box hidden" id="register-box">
            <h2>Register</h2>
            <form>
                <input type="text" id="full_name" placeholder="full name">
                <input type="email" id="email" placeholder="email">
                <input type="password" id="password" placeholder="password">
                <button type="submit">submit</button>
                <p>I already have an account ? <a href="#" onclick="toggleForms()">Log in here</a></p>
            </form>
        </div>
    </div>

</body>
</html>
