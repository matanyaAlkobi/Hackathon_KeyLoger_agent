<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <title>תיקיית {{ folder_name }}</title>
</head>
<body>
    <h1>בחר תאריכים</h1>
    <form id="dateForm">
        <label for="start_date">תאריך התחלה:</label>
        <select name="start_date" id="start_date">
            {% for date in available_dates %}
            <option value="{{ date }}">{{ date }}</option>
            {% endfor %}
        </select>
        
        <label for="end_date">תאריך סוף:</label>
        <select name="end_date" id="end_date">
            {% for date in available_dates %}
            <option value="{{ date }}">{{ date }}</option>
            {% endfor %}
        </select>
        
        <button type="button" onclick="submitForm()">שלח</button>
    </form>

    <script>
        function submitForm() {
            // קבלת התאריכים שנבחרו
            var startDate = document.getElementById("start_date").value;
            var endDate = document.getElementById("end_date").value;
            
            // יצירת כתובת ה-URL החדשה עם התאריכים כחלק מה-path
            var url = "/folders/{{ folder_name }}/" + startDate + "/" + endDate;
            
            // הפניית הדפדפן לכתובת החדשה
            window.location.href = url;
        }
    </script>
</body>
</html>
