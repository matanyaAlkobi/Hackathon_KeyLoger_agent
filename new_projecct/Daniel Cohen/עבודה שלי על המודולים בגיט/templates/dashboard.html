<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #2E2E2E;
            color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1A1A1A;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #444;
        }

        header h1 {
            font-size: 36px;
            margin: 0;
        }

        header h2 {
            font-size: 24px;
            margin-top: 10px;
        }

        h2 a {
            text-decoration: none;
            color: #1E90FF;
            font-weight: bold;
        }

        #folder-list {
            list-style-type: none;
            padding: 0;
            margin: 20px;
        }

        #folder-list li {
            background-color: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s;
        }

        #folder-list li:hover {
            background-color: #444;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #1E90FF;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .alert-box {
            background-color: #f44336;
            color: white;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            display: none;
        }

        .alert-box.show {
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome, {{ current_user.id }}</h1>
        <h2>Folder List</h2>
    </header>
    
    <div class="alert-box" id="alert-box">
        <strong>Warning!</strong> Please confirm the action.
    </div>

    <ul id="folder-list">
        <!-- Folder list will be dynamically loaded here using JavaScript -->
    </ul>

    <footer>
        <h2><a href="{{ url_for('logout') }}" class="button">Logout</a></h2>
    </footer>

    <script src="../static/dashboard_script.js"></script> <!-- Linking to external JS file -->
</body>
</html>
