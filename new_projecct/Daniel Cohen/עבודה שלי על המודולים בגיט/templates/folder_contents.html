<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folder {{ folder_name }}</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow-x: hidden; /* Ensure no horizontal scrolling */
        }

        /* Header */
        header {
            background-color: #1b1b1b;
            padding: 20px 30px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        header h1 {
            color: #1E90FF;
            font-size: 36px;
            font-weight: bold;
        }

        /* Form Styles */
        form {
            background-color: #1f1f1f;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
            margin-top: 100px;
        }

        label {
            font-size: 18px;
            margin-right: 10px;
            color: #B0C4DE;
        }

        select {
            padding: 10px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            margin: 10px 0;
            width: 100%;
        }

        button {
            background-color: #1E90FF;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #32CD32;
            transform: scale(1.05);
        }

        button:focus {
            outline: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .container .buttons {
            display: flex;
            gap: 15px;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            form {
                padding: 20px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Choose Dates</h1>
    </header>

    <div class="container">
        <form id="dateForm">
            <div>
                <label for="start_date">Start Date:</label>
                <select name="start_date" id="start_date">
                    {% for date in available_dates %}
                    <option value="{{ date }}">{{ date }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="end_date">End Date:</label>
                <select name="end_date" id="end_date">
                    {% for date in available_dates %}
                    <option value="{{ date }}">{{ date }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="buttons">
                <button type="button" onclick="submitForm()">Submit</button>
                <button type="button" onclick="confirmStop()">Stop</button>
            </div>
        </form>
    </div>

    <script>
        function submitForm() {
            var startDate = document.getElementById("start_date").value;
            var endDate = document.getElementById("end_date").value;
            var url = "/folders/{{ folder_name }}/" + startDate + "/" + endDate;
            window.location.href = url;
        }

        function confirmStop() {
            var confirmation = confirm("Are you sure you want to stop the order for this computer?");
            if (confirmation) {
                var url = "/folders/{{ folder_name }}/stop";
                window.location.href = url;
            } else {
                console.log("User canceled the action.");
            }
        }
    </script>

</body>
</html>
