<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="../static/style_navbar.css">
    <style>
        /* בסיסי עיצוב */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212; /* רקע כהה */
            color: #f4f4f4;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background-color: #1b1b1b; /* רקע כהה */
            border-bottom: 2px solid #444;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        /* כפתור הבית */
        .home {
            font-size: 24px;
            color: #1E90FF;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        .home:hover {
            color: #32CD32; /* צבע ירוק */
        }

        /* ניווט */
        .navbar {
            display: flex;
            gap: 20px;
        }

        .navbar a {
            color: #B0C4DE;
            text-decoration: none;
            font-size: 18px;
            font-weight: 500;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            background-color: #1E90FF;
            color: white;
            transform: scale(1.1); /* הגדלה עדינה */
        }

        /* ריספונסיביות (Mobile first) */
        @media screen and (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .home {
                font-size: 20px;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <a href="/folders" class="home">Home</a>

        <nav class="navbar">
            <a href="#">To Send</a>
            <a href="#">Guide</a>
            <a href="#">About</a>
        </nav>
    </header>

</body>
</html>
